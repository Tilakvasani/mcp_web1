[project]
name = "app"
version = "0.2.0"
description = "HubSpot CRM Agent — LangChain + LangGraph + FastAPI + HubSpot MCP OAuth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # LangChain stack
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    # MCP client
    "mcp[cli]>=1.8.0",
    # Web
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # HTTP + env
    "httpx>=0.27.0",
    "python-dotenv>=1.1.0",
]

[tool.uv]
dev-dependencies = []
